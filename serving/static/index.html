<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ward Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1628;
    --panel: #111F35;
    --panel-border: #1E2F4D;
    --text: #E6EDF3;
    --muted: #7C8A9E;
    --hr: #4ADE80;
    --spo2: #38BDF8;
    --bp: #FB7185;
    --temp: #FBBF24;
    --critical: #EF4444;
    --warning: #FBBF24;
    --ok: #4ADE80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .status {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--ok);
  }
  .dot.down { background: var(--critical); box-shadow: 0 0 6px var(--critical); }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }

  section { margin-bottom: 36px; }
  section h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--panel-border);
  }

  .patient-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .patient-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--panel-border);
    padding: 14px 16px;
    position: relative;
  }
  .patient-card.worsening { border-left-color: var(--critical); }
  .patient-card .pid {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .patient-card .trend {
    float: right;
    font-size: 11px;
    color: var(--muted);
  }
  .patient-card .trend.worsening { color: var(--critical); }
  .vitals-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 4px;
    margin-top: 12px;
  }
  .vital { line-height: 1.25; }
  .vital .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
    font-weight: 500;
  }
  .vital .label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .vital.hr .num { color: var(--hr); }
  .vital.spo2 .num { color: var(--spo2); }
  .vital.bp .num { color: var(--bp); }
  .vital.temp .num { color: var(--temp); }
  .patient-card .time {
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
  }

  .alerts-list { display: flex; flex-direction: column; gap: 6px; }
  .alert-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--warning);
    font-size: 13px;
  }
  .alert-row.critical { border-left-color: var(--critical); }
  .alert-row .sev {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--warning);
    width: 62px;
    flex-shrink: 0;
  }
  .alert-row.critical .sev { color: var(--critical); }
  .alert-row .msg { flex: 1; color: var(--text); }
  .alert-row .ts { color: var(--muted); font-size: 11px; flex-shrink: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    font-size: 11px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--panel-border);
  }
  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-family: 'IBM Plex Mono', monospace;
  }
  .risk-badge {
    display: inline-block;
    padding: 2px 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    border-radius: 2px;
  }
  .risk-low { color: var(--ok); background: rgba(74,222,128,0.12); }
  .risk-medium { color: var(--temp); background: rgba(251,191,36,0.12); }
  .risk-high { color: var(--bp); background: rgba(251,113,133,0.12); }
  .risk-critical { color: var(--critical); background: rgba(239,68,68,0.14); }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }
  .day-selector {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 4px 8px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Ward Monitor</h1>
    <div class="sub">Bedside vitals &amp; daily risk reconciliation</div>
  </div>
  <div class="status">
    <span id="clock"></span>
    <span><span class="dot" id="conn-dot"></span><span id="conn-text">connected</span></span>
    <span id="patient-count">0 patients</span>
  </div>
</div>

<main>
  <section>
    <h2>Live vitals</h2>
    <div class="patient-grid" id="patient-grid">
      <div class="empty">Waiting for data&hellip;</div>
    </div>
  </section>

  <section>
    <h2>Active alerts</h2>
    <div class="alerts-list" id="alerts-list">
      <div class="empty">No active alerts.</div>
    </div>
  </section>

  <section>
    <h2>
      Daily risk report &mdash;
      <input class="day-selector" id="day-input" type="number" value="1" min="1" style="width:50px" />
    </h2>
    <table id="risk-table">
      <thead>
        <tr>
          <th>Patient</th>
          <th>Vitals trend</th>
          <th>Breaches (24h)</th>
          <th>Abnormal labs</th>
          <th>Risk score</th>
          <th>Level</th>
        </tr>
      </thead>
      <tbody id="risk-body">
        <tr><td colspan="6" class="empty">No report generated yet for this day.</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
  // Point this at your FastAPI serving layer. Same-origin by default,
  // since this file is served from serving/static/ by the API itself.
  const API_BASE = "";

  function fmtTime(iso) {
    if (!iso) return "--";
    const d = new Date(iso);
    return d.toLocaleTimeString();
  }

  async function fetchJSON(path) {
    const res = await fetch(API_BASE + path);
    if (!res.ok) throw new Error(`${path} -> ${res.status}`);
    return res.json();
  }

  async function refreshWard() {
    try {
      const data = await fetchJSON("/ward/live");
      const grid = document.getElementById("patient-grid");
      document.getElementById("patient-count").textContent = `${data.count} patients`;
      setConnected(true);

      if (!data.patients.length) {
        grid.innerHTML = '<div class="empty">No vitals ingested yet.</div>';
        return;
      }

      grid.innerHTML = data.patients.map(p => {
        const worsening = p.trend_flag === "worsening";
        return `
          <div class="patient-card ${worsening ? "worsening" : ""}">
            <span class="pid">${p.patient_id}</span>
            <span class="trend ${worsening ? "worsening" : ""}">${p.trend_flag || "stable"}</span>
            <div class="vitals-row">
              <div class="vital hr"><div class="num">${round1(p.heart_rate)}</div><div class="label">heart rate · bpm</div></div>
              <div class="vital spo2"><div class="num">${round1(p.spo2)}</div><div class="label">SpO&#8322; · %</div></div>
              <div class="vital bp"><div class="num">${round1(p.systolic_bp)}/${round1(p.diastolic_bp)}</div><div class="label">blood pressure</div></div>
              <div class="vital temp"><div class="num">${round1(p.temperature)}</div><div class="label">temp · &deg;C</div></div>
            </div>
            <div class="time">last reading ${fmtTime(p.event_timestamp)}</div>
          </div>
        `;
      }).join("");
    } catch (e) {
      setConnected(false);
    }
  }

  function round1(v) {
    if (v === null || v === undefined) return "--";
    return Number(v).toFixed(1);
  }

  async function refreshAlerts() {
    try {
      const data = await fetchJSON("/alerts/active");
      const list = document.getElementById("alerts-list");
      if (!data.alerts.length) {
        list.innerHTML = '<div class="empty">No active alerts.</div>';
        return;
      }
      list.innerHTML = data.alerts.map(a => `
        <div class="alert-row ${a.severity === "critical" ? "critical" : ""}">
          <span class="sev">${a.severity}</span>
          <span class="msg">${a.message}</span>
          <span class="ts">${fmtTime(a.triggered_at)}</span>
        </div>
      `).join("");
    } catch (e) { /* leave last known state */ }
  }

  async function refreshRiskReport() {
    const day = document.getElementById("day-input").value || 1;
    try {
      const data = await fetchJSON(`/reports/daily/${day}`);
      const body = document.getElementById("risk-body");
      if (!data.patients.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty">No report generated yet for this day.</td></tr>';
        return;
      }
      body.innerHTML = data.patients.map(p => `
        <tr>
          <td>${p.patient_id}</td>
          <td>${p.vitals_trend_flag || "--"}</td>
          <td>${p.abnormal_vitals_24h}</td>
          <td>${(p.latest_abnormal_labs || []).length}</td>
          <td>${p.risk_score}</td>
          <td><span class="risk-badge risk-${p.risk_level}">${p.risk_level}</span></td>
        </tr>
      `).join("");
    } catch (e) { /* leave last known state */ }
  }

  function setConnected(ok) {
    document.getElementById("conn-dot").classList.toggle("down", !ok);
    document.getElementById("conn-text").textContent = ok ? "connected" : "disconnected";
  }

  function tickClock() {
    document.getElementById("clock").textContent = new Date().toLocaleTimeString();
  }

  document.getElementById("day-input").addEventListener("change", refreshRiskReport);

  setInterval(refreshWard, 5000);
  setInterval(refreshAlerts, 5000);
  setInterval(refreshRiskReport, 15000);
  setInterval(tickClock, 1000);

  refreshWard();
  refreshAlerts();
  refreshRiskReport();
  tickClock();
</script>

</body>
</html>
